# E2E (Playwright + Chrome) — specs/14 §4.3.
# 로컬과 같은 전체 스택(PostgreSQL · Redis · Django · Celery · Vite)을 띄우고 tests/ 를 돌린다.
name: E2E (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      db:
        # pgvector 확장이 들어 있는 PostgreSQL 16 (specs/13 §6)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hrsg
          POSTGRES_USER: hrsg
          POSTGRES_PASSWORD: hrsg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrsg" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      # E2E 는 한 IP 에서 가입을 여러 번 한다. 운영 기본값(시간당 10회)을 테스트에서만 올린다.
      THROTTLE_SIGNUP: 1000/hour

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Backend — 설치 · 마이그레이션 · 시드
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed_defaults

      - name: Backend — Django · Celery 기동
        working-directory: backend
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > ../django.log 2>&1 &
          nohup celery -A config worker -l info --pool=solo > ../celery.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health/ready/ && exit 0
            sleep 1
          done
          cat ../django.log; exit 1

      - name: Frontend · Playwright 설치
        run: |
          npm ci
          npm --prefix frontend ci
          npx playwright install --with-deps chrome

      - name: E2E 실행
        run: npx playwright test

      - name: 서버 로그
        if: failure()
        run: tail -n 200 django.log celery.log

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
