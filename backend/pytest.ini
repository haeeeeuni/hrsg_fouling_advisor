[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
# 각 Phase에서 앱이 추가되면 여기에 함께 등록한다.
testpaths = accounts units common ingestion maintenance analysis reports
addopts = -q --reuse-db
filterwarnings =
    # pandas 내부에서 Timestamp - Timedelta 시 발생하는 numpy 2.x 예고 경고. 우리 코드와 무관하다.
    ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning
