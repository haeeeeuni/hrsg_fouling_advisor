# AGENTS.md §4 — black(line-length 100), isort, ruff

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "/migrations/"

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*"]
known_first_party = ["accounts", "calculator", "common", "config", "reference"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.coverage.run]
# 순수 함수 서비스가 생기는 마일스톤마다 추가한다(AGENTS.md §8).
source = ["accounts", "common", "reference", "calculator"]
omit = ["*/tests/*", "*/migrations/*"]
