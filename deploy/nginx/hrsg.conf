# HRSG Fouling Advisor — Nginx 구성 (specs/18 §7)
#
#   /        → frontend/dist (SPA, index.html 폴백)
#   /api/    → Gunicorn
#   /static/ → collectstatic 결과
#   /media/  → 직접 접근 차단 (인증 경유 다운로드만 허용)

upstream hrsg_app {
    server app:8000;
    keepalive 16;
}

# HTTP 는 HTTPS 로 넘긴다. 헬스체크만 예외로 둔다(LB 가 http 로 찌른다).
server {
    listen 80;
    server_name _;

    location /api/health/ {
        proxy_pass http://hrsg_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 업로드 상한은 Django 쪽 max_upload_mb(기본 200) 와 맞춘다.
    # 여기가 더 작으면 Django 의 친절한 검증 메시지 대신 nginx 413 이 나간다.
    client_max_body_size 210m;

    # 대용량 CSV 업로드는 디스크로 버퍼링한다.
    client_body_buffer_size 256k;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- SPA ---
    root /srv/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 빌드 산출물은 길게 캐시한다. index.html 은 절대 캐시하지 않는다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- API ---
    location /api/ {
        proxy_pass http://hrsg_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django 의 SECURE_PROXY_SSL_HEADER 가 이 값을 보고 https 로 판단한다.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # gunicorn 의 timeout(기본 120초)보다 길게 둔다.
        # 먼저 끊기면 502 가 되어 원인 파악이 어렵다.
        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_buffering off;
    }

    # --- Django admin 정적 파일 ---
    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    # --- 업로드 원본·리포트 (specs/18 §2, §7) ---
    # 링크만 알면 받아갈 수 있으면 안 된다. 반드시 Django 인증을 거친다.
    # appvar 볼륨을 통째로 붙이되(/srv/appvar), media 하위만 노출한다.
    # uploads/ reports/ models/ 는 이 alias 밖이라 접근 경로가 없다.
    location /media/ {
        internal;
        alias /srv/appvar/media/;
    }
}
