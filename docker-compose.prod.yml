# 운영 구성 (specs/18 §7).
#   nginx → app(gunicorn) → postgres / redis
#   worker(celery) 가 업로드 적재·분석·재학습·리포트를 맡는다.
#
# 구동 절차는 DEPLOY.md 참조. 개발용 인프라는 docker-compose.yml 이 따로 있다.

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY 를 .env 에 설정하세요}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?서비스 도메인을 설정하세요}
  DB_NAME: ${DB_NAME:-hrsg}
  DB_USER: ${DB_USER:-hrsg}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 설정하세요}
  DB_HOST: db
  DB_PORT: 5432
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  MEDIA_ROOT: /app/var/media
  UPLOAD_ROOT: /app/var/uploads
  REPORT_ROOT: /app/var/reports
  MODEL_ARTIFACT_ROOT: /app/var/models

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-hrsg}
      POSTGRES_USER: ${DB_USER:-hrsg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 설정하세요}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hrsg} -d ${DB_NAME:-hrsg}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 결과 백엔드가 날아가도 도메인 테이블이 진실이므로 영속화하지 않는다.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 마이그레이션·시드·정적파일 수집을 한 번만 수행하고 끝난다.
  # app 과 worker 가 이 완료를 기다린다.
  migrate:
    build:
      context: ./backend
    environment:
      <<: *app-env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_defaults &&
             python manage.py collectstatic --noinput"
    volumes:
      - appvar:/app/var
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ./backend
    environment:
      <<: *app-env
    volumes:
      - appvar:/app/var
      - staticfiles:/app/staticfiles
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # 내부 http 요청이라 prod.py 의 SECURE_REDIRECT_EXEMPT 에 걸려 리다이렉트되지 않는다.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/ready/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    environment:
      <<: *app-env
    # 분석·리포트는 메모리를 쓴다. 동시 실행 수를 낮게 잡고 필요시 올린다.
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - appvar:/app/var
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend-build:
    build:
      context: ./frontend
    volumes:
      - frontend-dist:/out
    command: sh -c "cp -r /dist/. /out/"
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/hrsg.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - frontend-dist:/srv/frontend:ro
      - staticfiles:/srv/static:ro
      - appvar:/srv/appvar:ro
    depends_on:
      app:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  appvar:
  staticfiles:
  frontend-dist:
